        // ================================================================
        // TOAST SYSTEM
        // ================================================================
        function showToast(type, message, duration = 4000) {
            const container = $('toast-container');
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <span class="toast-icon">${icons[type] || ''}</span>
                <span class="toast-message">${message}</span>
                <button class="toast-close" onclick="this.closest('.toast').remove()">✕</button>
                <div class="toast-timer"></div>
            `;
            container.appendChild(toast);

            const remove = () => {
                if (toast.parentElement) {
                    toast.classList.add('removing');
                    setTimeout(() => toast.remove(), 250);
                }
            };

            const timer = setTimeout(remove, duration);
            toast.querySelector('.toast-close').addEventListener('click', () => {
                clearTimeout(timer);
                remove();
            });
        }

        // ================================================================
        // MODE SWITCHING
        // ================================================================
        function setMode(mode) {
            currentMode = mode;
            $('config-brute').classList.toggle('hidden', mode !== 'brute');
            $('config-prefix').classList.toggle('hidden', mode !== 'prefix');

            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.dataset.mode === mode);
            });
        }

        // ================================================================
        // TLD PICKER
        // ================================================================
        let tldGroup = "core";
        try {
            const savedGroup = localStorage.getItem("dc-tld-tab");
            if (savedGroup && document.querySelector('#tld-tabs .tld-tab[data-group="' + savedGroup + '"]')) {
                tldGroup = savedGroup;
            }
        } catch (e) {}

        function syncTldCurrent(tld) {
            const label = document.getElementById("tld-current");
            if (label) label.textContent = "." + tld;
        }

        function selectTld(tld) {
            document.querySelectorAll("#tld-pills .pill").forEach(p => {
                p.classList.toggle("selected", p.dataset.tld === tld);
            });
            $("tld").value = tld;
            syncTldCurrent(tld);
        }

        function renderTldPicker() {
            const raw = ($("tld-search").value || "").trim().toLowerCase().replace(/^\./, "");
            document.querySelectorAll("#tld-tabs .tld-tab").forEach(tab => {
                tab.classList.toggle("is-on", !raw && tab.dataset.group === tldGroup);
            });
            let shown = 0;
            document.querySelectorAll("#tld-pills .pill").forEach(pill => {
                const hit = !raw
                    ? pill.dataset.group === tldGroup
                    : pill.dataset.tld.includes(raw);
                pill.hidden = !hit;
                if (hit) shown += 1;
            });
            const empty = document.getElementById("tld-empty");
            if (empty) empty.hidden = shown !== 0;
        }

        document.getElementById("tld-tabs").addEventListener("click", (e) => {
            const tab = e.target.closest(".tld-tab");
            if (!tab) return;
            tldGroup = tab.dataset.group;
            try { localStorage.setItem("dc-tld-tab", tldGroup); } catch (err) {}
            $("tld-search").value = "";
            renderTldPicker();
        });

        $("tld-search").addEventListener("input", renderTldPicker);

        document.getElementById("tld-pills").addEventListener("click", (e) => {
            const pill = e.target.closest(".pill");
            if (!pill || pill.hidden) return;
            selectTld(pill.dataset.tld);
            if ($("tld-search").value.trim()) {
                tldGroup = pill.dataset.group;
                try { localStorage.setItem("dc-tld-tab", tldGroup); } catch (err) {}
                $("tld-search").value = "";
                renderTldPicker();
            }
        });

        renderTldPicker();
        syncTldCurrent($("tld").value || "de");

        // ================================================================
        // INIT
        // ================================================================
        // ================================================================
        // AUTH
        // ================================================================
        let authToken = localStorage.getItem('dc-token') || '';

        function authFetch(url, options = {}) {
            if (authToken) {
                options.headers = options.headers || {};
                if (options.headers instanceof Headers) {
                    options.headers.set('Authorization', `Bearer ${authToken}`);
                } else {
                    options.headers['Authorization'] = `Bearer ${authToken}`;
                }
            }
            return fetch(url, options);
        }

        async function doLogin() {
            const pw = $('login-password').value;
            if (!pw) return;
            try {
                const resp = await fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pw }),
                });
                const data = await resp.json();
                if (data.ok) {
                    authToken = data.token || '';
                    if (authToken) localStorage.setItem('dc-token', authToken);
                    $('login-overlay').classList.remove('visible');
                    initApp();
                } else {
                    $('login-error').textContent = data.error || '密码错误';
                    $('login-error').classList.add('visible');
                }
            } catch (err) {
                $('login-error').textContent = '连接失败';
                $('login-error').classList.add('visible');
            }
        }

        // Enter key on password input
        document.addEventListener('DOMContentLoaded', () => {
            $('login-password').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') doLogin();
            });
        });

        async function checkAuth() {
            try {
                const resp = await fetch('/auth/check');
                const data = await resp.json();
                if (!data.need_auth) {
                    initApp();
                    return;
                }
                // Need auth — check if stored token is valid
                if (authToken) {
                    const test = await authFetch('/history?limit=1');
                    if (test.ok) {
                        initApp();
                        return;
                    }
                    // Token expired
                    authToken = '';
                    localStorage.removeItem('dc-token');
                }
                // Show login
                $('login-overlay').classList.add('visible');
                $('login-password').focus();
            } catch (err) {
                // Server unreachable, show login
                $('login-overlay').classList.add('visible');
            }
        }

        function initApp() {
            initTheme();
            restoreLastResults();
            restoreLastResultsFromServer();
            checkActiveScan();
            loadWordMeta();
            setMode('prefix');
            setTimeout(loadHistory, 300);

            $('prefix').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !scanningActive) startScan();
            });
            $('suffix').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !scanningActive) startScan();
            });
        }

        window.addEventListener('DOMContentLoaded', checkAuth);

        // ================================================================
        // WORD META
        // ================================================================
        async function loadWordMeta() {
            try {
                const resp = await authFetch('/words-meta');
                const data = await resp.json();
                const updateInfo = () => {
                    const len = $('word-length').value;
                    const onlyCommon = $('only-common').checked;
                    const info = data[len] || { total: 0, common_count: 0 };
                    const count = onlyCommon ? info.common_count : info.total;
                    const useP = $('use-prefix').checked;
                    const useS = $('use-suffix').checked;
                    const rawP = useP ? $('prefix').value.trim().toLowerCase() : '';
                    const rawS = useS ? $('suffix').value.trim().toLowerCase() : '';
                    const hasPrefix = useP && rawP !== '' && rawP !== '@';
                    const hasSuffix = useS && rawS !== '' && rawS !== '@';

                    if (!hasPrefix && !hasSuffix) {
                        $('word-count-info').textContent = `📖 ${len}字母单词共 ${info.total} 个（常用 ${info.common_count} 个），将扫描 ${count} 个域名（无前后缀）`;
                    } else if (hasPrefix && !hasSuffix) {
                        $('word-count-info').textContent = `📖 ${len}字母单词共 ${info.total} 个（常用 ${info.common_count} 个），将扫描 ${count} 个域名（前缀: ${rawP}）`;
                    } else if (!hasPrefix && hasSuffix) {
                        $('word-count-info').textContent = `📖 ${len}字母单词共 ${info.total} 个（常用 ${info.common_count} 个），将扫描 ${count} 个域名（后缀: ${rawS}）`;
                    } else {
                        $('word-count-info').textContent = `📖 ${len}字母单词共 ${info.total} 个（常用 ${info.common_count} 个），将扫描 ${count} 个域名（前缀: ${rawP}, 后缀: ${rawS}）`;
                    }
                };
                updateInfo();
                $('word-length').addEventListener('change', updateInfo);
                $('only-common').addEventListener('change', updateInfo);
                $('use-prefix').addEventListener('change', updateInfo);
                $('use-suffix').addEventListener('change', updateInfo);
                $('prefix').addEventListener('input', updateInfo);
                $('suffix').addEventListener('input', updateInfo);
            } catch (e) {
                $('word-count-info').textContent = '⚠️ 无法加载词表';
            }
        }

        // ================================================================
        // RESTORE FROM LOCALSTORAGE
        // ================================================================
        function restoreLastResults() {
            try {
                const saved = localStorage.getItem('domain_checker_last_results');
                if (!saved) return;
                const data = JSON.parse(saved);
                const elapsed = Date.now() - data.timestamp;
                if (elapsed > 3600_000) return;

                const tld = data.tld || '';
                const count = data.domains ? data.domains.length : 0;
                const timeStr = new Date(data.timestamp).toLocaleTimeString('zh-CN');

                $('restore-text').textContent =
                    `📋 上次扫描 (.${tld}) 在 ${timeStr} 完成，找到 ${count} 个可注册域名`;
                $('restore-banner').classList.add('visible');

                if (data.domains && data.domains.length > 0) {
                    renderAllResults(data.domains, false);
                    $('results-count').textContent = `${data.domains.length}`;
                }
            } catch (e) { /* ignore */ }
        }

        function dismissRestore() {
            $('restore-banner').classList.remove('visible');
        }

        // ================================================================
        // CHECK ACTIVE SCAN (reconnection)
        // ================================================================
        async function checkActiveScan() {
            try {
                const resp = await authFetch('/scan/active');
                const data = await resp.json();
                if (!data.scan_id) return;

                $('restore-text').textContent =
                    `🔴 扫描进行中 (.${data.tld})：已检测 ${data.checked}/${data.total}（${data.pct}%），耗时 ${data.elapsed}s`;
                $('restore-banner').classList.add('visible');

                const btn = document.createElement('button');
                btn.className = 'btn btn-primary btn-sm';
                btn.textContent = '继续查看';
                btn.onclick = reconnectScan;
                $('restore-action').appendChild(btn);

                currentScanId = data.scan_id;
            } catch (e) { /* ignore */ }
        }

        async function reconnectScan() {
            if (!currentScanId) return;
            dismissRestore();

            foundDomains = [];
            $('results-grid').innerHTML = '';

            $('progress-section').classList.add('visible');
            $('results-area').classList.add('visible');
            $('results-empty').classList.remove('visible');
            $('scanning-hint').classList.add('visible');
            $('btn-start').disabled = true;
            $('btn-start').innerHTML = '⏳ 扫描中...';
            $('btn-cancel').classList.remove('hidden');

            const resp = await authFetch(`/scan/results/${currentScanId}`);
            const state = await resp.json();
            if (state.available && state.available.length > 0) {
                for (const d of state.available) addFoundDomain(d);
            }

            const total = state.total || 0;
            connectSSE(currentScanId, total);
        }

        // ================================================================
        // RESTORE FROM SERVER
        // ================================================================
        async function restoreLastResultsFromServer() {
            try {
                if ($('restore-banner').classList.contains('visible')) return;

                const resp = await authFetch('/scan/last');
                const data = await resp.json();
                if (!data.domains || data.domains.length === 0) return;

                const elapsed = Date.now() - (data.timestamp * 1000 || 0);
                if (elapsed > 3600_000) return;

                const count = data.domains.length;
                const timeStr = new Date(data.timestamp * 1000).toLocaleTimeString('zh-CN');

                $('restore-text').textContent =
                    `📋 上次扫描 (.${data.tld}) 在 ${timeStr} 完成，找到 ${count} 个可注册域名`;
                $('restore-banner').classList.add('visible');

                renderAllResults(data.domains, false);
                $('results-count').textContent = `${data.domains.length}`;
            } catch (e) { /* ignore */ }
        }

        // ================================================================
        // CONFIG
        // ================================================================
        function getConfig() {
            const tld = $('tld').value;

            if (currentMode === 'prefix') {
                const rawP = $('prefix').value.trim().toLowerCase();
                const rawS = $('suffix').value.trim().toLowerCase();
                const useP = $('use-prefix').checked;
                const useS = $('use-suffix').checked;
                // 未启用或 @/空 均视为无前缀/无后缀
                const prefix = (useP && rawP !== '' && rawP !== '@') ? rawP : '';
                const suffix = (useS && rawS !== '' && rawS !== '@') ? rawS : '';
                const wordLength = parseInt($('word-length').value);
                const onlyCommon = $('only-common').checked;
                return { mode: 'prefix_word', tld, prefix, suffix, word_length: wordLength, only_common: onlyCommon };
            }

            const lengths = Array.from(
                document.querySelectorAll('#config-brute input[type="checkbox"][value]:checked')
            ).map(cb => parseInt(cb.value)).filter(v => !isNaN(v)).sort();
            const useDigits = $('use-digits').checked;
            return { mode: 'brute', tld, lengths, use_digits: useDigits };
        }

        function validateConfig(cfg) {
            if (cfg.mode === 'brute' && (!cfg.lengths || cfg.lengths.length === 0)) {
                showToast('warning', '请至少选择一个域名长度');
                return false;
            }
            return true;
        }

        // ================================================================
        // START SCAN
        // ================================================================
        async function startScan() {
            const cfg = getConfig();
            if (!cfg || !validateConfig(cfg)) return;

            if (eventSource) { eventSource.close(); eventSource = null; }

            foundDomains = [];
            scanningActive = true;
            currentSort = 'default';
            dismissRestore();

            // Reset UI
            $('btn-start').disabled = true;
            $('btn-start').innerHTML = '⏳ 扫描中...';
            $('btn-cancel').classList.remove('hidden');
            $('progress-section').classList.add('visible');
            $('results-area').classList.add('visible');

            // Reset progress
            $('progress-fill').style.width = '0%';
            $('progress-pct-large').textContent = '0%';
            updateRing(0);
            $('stat-checked').textContent = '0';
            $('stat-whois').textContent = '0';
            $('stat-found').textContent = '0';
            $('stat-elapsed').textContent = '0s';
            $('speed-info').textContent = '⏳ 准备中...';
            $('eta-info').textContent = '';
            $('stat-found-card').classList.remove('has-results');

            // Reset results
            $('results-grid').innerHTML = '';
            $('results-empty').classList.remove('visible');
            $('scanning-hint').classList.add('visible');
            $('results-count').textContent = '0';
            $('results-filter').value = '';
            $('filter-clear').classList.remove('visible');

            // Reset sort buttons
            document.querySelectorAll('.btn-sort').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-sort="default"]').classList.add('active');

            // Set connection status
            updateConnStatus('connected');

            try {
                const resp = await authFetch('/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cfg),
                });
                const data = await resp.json();
                if (data.error) {
                    showToast('error', data.error);
                    resetUI();
                    return;
                }
                currentScanId = data.scan_id;
                totalDomains = data.total;
                scanStartTime = Date.now();
                lastChecked = 0;
                lastCheckTime = Date.now();

                // Show incremental banner if applicable
                if (data.incremental && data.skipped > 0) {
                    showIncrementalBanner(data.skipped, data.full_count, data.total);
                }

                connectSSE(currentScanId, data.total);
            } catch (err) {
                showToast('error', '启动失败: ' + err.message);
                resetUI();
            }
        }

        // ================================================================
        // SSE CONNECTION
        // ================================================================
        function connectSSE(scanId, total) {
            const sseUrl = authToken ? `/scan/events/${scanId}?token=${authToken}` : `/scan/events/${scanId}`;
            eventSource = new EventSource(sseUrl);

            eventSource.addEventListener('progress', (e) => {
                const data = JSON.parse(e.data);
                const pct = data.pct || 0;
                $('progress-fill').style.width = pct + '%';
                updateRing(pct);
                $('progress-pct-large').textContent = pct.toFixed(1) + '%';
                $('stat-checked').textContent = data.checked;
                if (data.whois_queried !== undefined) {
                    $('stat-whois').textContent = data.whois_queried;
                }

                // Speed & ETA
                const now = Date.now();
                const checked = data.checked;
                const elapsed = (now - scanStartTime) / 1000;
                $('stat-elapsed').textContent = elapsed.toFixed(1) + 's';

                if (elapsed > 0.5 && checked > 0) {
                    const speed = (checked / elapsed).toFixed(1);
                    $('speed-info').textContent = `⚡ ~${speed} 域名/秒`;
                    if (checked < total && speed > 0) {
                        const remaining = total - checked;
                        const eta = Math.ceil(remaining / parseFloat(speed));
                        $('eta-info').textContent = `预计剩余 ${eta}s`;
                    }
                }
            });

            eventSource.addEventListener('snapshot', (e) => {
                const data = JSON.parse(e.data);
                if (data.checked > 0) {
                    const pct = data.total > 0 ? (data.checked / data.total * 100) : 0;
                    $('progress-fill').style.width = pct + '%';
                    updateRing(pct);
                    $('progress-pct-large').textContent = pct.toFixed(1) + '%';
                    $('stat-checked').textContent = data.checked;
                }
            });

            eventSource.addEventListener('found', (e) => {
                const data = JSON.parse(e.data);
                addFoundDomain(data.domain);
                $('stat-found').textContent = foundDomains.length;
                $('stat-found-card').classList.add('has-results');

                // Confetti on first find
                if (foundDomains.length === 1) {
                    spawnConfetti(30);
                }
            });

            eventSource.addEventListener('ratelimit', (e) => {
                const data = JSON.parse(e.data);
                showToast('warning', `⚠️ 检测到限流，自动降速至每批间隔 ${data.sleep}s`, 3000);
            });

            eventSource.addEventListener('retry', (e) => {
                const data = JSON.parse(e.data);
                showToast('warning', `⚠️ ${data.count} 个域名因限流未能确认，等待 ${data.wait}s 后自动复检`, 5000);
            });

            eventSource.addEventListener('done', (e) => {
                scanningActive = false;
                const data = JSON.parse(e.data);
                $('progress-fill').style.width = '100%';
                updateRing(100);
                $('progress-pct-large').textContent = '100%';
                $('scanning-hint').classList.remove('visible');

                if (data.cancelled) {
                    showToast('warning', '扫描已停止');
                    loadHistory();
                } else {
                    const count = data.available_count || foundDomains.length;
                    showToast('success', `扫描完成！共检测 ${data.total_checked} 个域名，找到 ${count} 个可注册域名`);
                    if (count > 0) spawnConfetti(60);
                }

                $('stat-elapsed').textContent = (data.elapsed || 0) + 's';
                $('stat-found').textContent = data.available_count || foundDomains.length;
                $('results-count').textContent = `${data.available_count || foundDomains.length}`;

                // Switch to paginated view
                currentPage = 1;
                renderCurrentPage();

                saveToLocalStorage(foundDomains);
                finishScan();
            });

            eventSource.addEventListener('error', (e) => {
                scanningActive = false;
                $('scanning-hint').classList.remove('visible');
                if (e.data) {
                    const data = JSON.parse(e.data);
                    showToast('error', data.message || '扫描出错');
                }
                updateConnStatus('disconnected');
                finishScan();
            });

            eventSource.addEventListener('heartbeat', () => {});
        }

        // ================================================================
        // PROGRESS RING
        // ================================================================
        function updateRing(pct) {
            const circle = $('progress-ring-fill');
            const circumference = 2 * Math.PI * 52; // ~326.73
            const offset = circumference - (pct / 100) * circumference;
            circle.style.strokeDashoffset = offset;
        }

        // ================================================================
        // ADD FOUND DOMAIN (live scan — append card directly)
        // ================================================================
        function addFoundDomain(domain) {
            foundDomains.push(domain);
            const parts = domain.split('.');
            const name = parts[0];
            const tld = parts.slice(1).join('.');
            const len = name.length;

            const card = document.createElement('div');
            card.className = 'domain-card';
            card.dataset.domain = domain;
            card.dataset.length = len;
            card.dataset.name = name;
            card.innerHTML = `
                <div class="domain-card-main">
                    <span class="domain-name">${domain}</span>
                    <span class="domain-tld-badge">.${tld}</span>
                </div>
                <div class="domain-card-meta">
                    <span class="domain-length">${len} 字母</span>
                    <span class="domain-status just-found">✨ 发现</span>
                </div>
                <div class="domain-card-actions">
                    <button class="btn-icon" title="复制" onclick="event.stopPropagation();copyDomain('${domain}', this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                </div>
            `;
            $('results-grid').appendChild(card);

            $('results-empty').classList.remove('visible');
            $('results-count').textContent = `${foundDomains.length}`;
        }

        // ================================================================
        // PAGINATION — getFilteredDomains, renderCurrentPage, gotoPage
        // ================================================================
        function getFilteredDomains() {
            const query = $('results-filter').value.toLowerCase().trim();
            let list = foundDomains;
            if (query) {
                list = list.filter(d => d.toLowerCase().includes(query));
            }
            if (currentSort === 'name') {
                list = list.slice().sort((a, b) => a.localeCompare(b));
            } else if (currentSort === 'length') {
                list = list.slice().sort((a, b) => {
                    const la = a.split('.')[0].length;
                    const lb = b.split('.')[0].length;
                    return la - lb || a.localeCompare(b);
                });
            }
            return list;
        }

        function renderCurrentPage() {
            const grid = $('results-grid');
            const pBar = $('pagination-bar');
            const total = foundDomains.length;

            if (total === 0) {
                grid.innerHTML = '';
                pBar.classList.remove('visible');
                $('results-empty').classList.add('visible');
                $('results-count').textContent = '0';
                return;
            }
            $('results-empty').classList.remove('visible');
            $('results-count').textContent = `${total}`;

            const filtered = getFilteredDomains();
            const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, filtered.length);
            const pageItems = filtered.slice(start, end);

            // Update pagination UI
            $('page-current').textContent = currentPage;
            $('page-total').textContent = totalPages;
            $('page-prev').disabled = currentPage <= 1;
            $('page-next').disabled = currentPage >= totalPages;
            pBar.classList.toggle('visible', totalPages > 1);

            // Rebuild grid — use DocumentFragment for performance
            const fragment = document.createDocumentFragment();
            pageItems.forEach(domain => {
                const parts = domain.split('.');
                const name = parts[0];
                const tld = parts.slice(1).join('.');
                const len = name.length;
                const card = document.createElement('div');
                card.className = 'domain-card';
                card.dataset.domain = domain;
                card.dataset.length = len;
                card.dataset.name = name;
                card.innerHTML = `
                    <div class="domain-card-main">
                        <span class="domain-name">${domain}</span>
                        <span class="domain-tld-badge">.${tld}</span>
                    </div>
                    <div class="domain-card-meta">
                        <span class="domain-length">${len} 字母</span>
                        <span class="domain-status available">可注册</span>
                    </div>
                    <div class="domain-card-actions">
                        <button class="btn-icon" title="复制" onclick="event.stopPropagation();copyDomain('${domain}', this)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        </button>
                    </div>
                `;
                fragment.appendChild(card);
            });
            grid.innerHTML = '';
            grid.appendChild(fragment);

            // Scroll to top when page changes
            grid.scrollTop = 0;
        }

        function gotoPage(n) {
            const filtered = getFilteredDomains();
            const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
            if (n < 1 || n > totalPages || n === currentPage) return;
            currentPage = n;
            renderCurrentPage();
        }

        // ================================================================
        // RENDER ALL RESULTS (for restore)
        // ================================================================
        function renderAllResults(domains, isLive = false) {
            $('results-area').classList.add('visible');
            $('scanning-hint').classList.remove('visible');

            foundDomains = domains.slice();
            currentPage = 1;

            if (!domains || domains.length === 0) {
                $('results-empty').classList.add('visible');
                $('pagination-bar').classList.remove('visible');
                $('results-grid').innerHTML = '';
                $('results-count').textContent = '0';
                return;
            }

            $('results-empty').classList.remove('visible');
            $('results-filter').value = '';
            $('filter-clear').classList.remove('visible');
            currentSort = 'default';
            document.querySelectorAll('.btn-sort').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-sort="default"]').classList.add('active');

            renderCurrentPage();
        }

        // ================================================================
        // FILTER & SORT
        // ================================================================
        function filterResults() {
            currentPage = 1;
            const clearBtn = $('filter-clear');
            clearBtn.classList.toggle('visible', $('results-filter').value.length > 0);
            renderCurrentPage();
        }

        function clearFilter() {
            $('results-filter').value = '';
            $('filter-clear').classList.remove('visible');
            currentPage = 1;
            renderCurrentPage();
            $('results-filter').focus();
        }

        function setSort(type, btn) {
            currentSort = type;
            document.querySelectorAll('.btn-sort').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPage = 1;
            renderCurrentPage();
        }

        // ================================================================
        // COPY & EXPORT
        // ================================================================
        async function copyDomain(domain, btn) {
            try {
                // Try clipboard API first (needs HTTPS/localhost)
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(domain);
                } else {
                    // Fallback for HTTP: create temp textarea
                    const ta = document.createElement('textarea');
                    ta.value = domain;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                }
                const origHTML = btn.innerHTML;
                btn.innerHTML = '<span style="color:#10b981;font-size:16px;">✓</span>';
                setTimeout(() => { btn.innerHTML = origHTML; }, 1200);
                showToast('success', `已复制 ${domain}`, 2000);
            } catch (err) {
                showToast('error', '复制失败');
            }
        }

        async function copyAllDomains() {
            const list = getFilteredDomains();
            if (list.length === 0) {
                showToast('info', '没有可复制的域名');
                return;
            }
            try {
                const text = list.join('\n');
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                }
                showToast('success', `已复制 ${list.length} 个域名`, 2500);
            } catch (err) {
                showToast('error', '复制失败');
            }
        }

        function exportResults() {
            const list = getFilteredDomains();
            if (list.length === 0) {
                showToast('info', '没有可导出的域名');
                return;
            }
            const tld = $('tld').value;
            let label = '';
            if (currentMode === 'prefix') {
                const useP = $('use-prefix').checked;
                const useS = $('use-suffix').checked;
                const rawP = $('prefix').value.trim().toLowerCase() || 'x';
                const rawS = $('suffix').value.trim().toLowerCase() || '';
                const prefix = (useP && rawP !== '' && rawP !== '@') ? rawP : '';
                const suffix = (useS && rawS !== '' && rawS !== '@') ? rawS : '';
                const wlen = $('word-length').value;
                if (!prefix && !suffix) {
                    label = `${wlen}字母单词`;
                } else if (prefix && !suffix) {
                    label = `${prefix}+${wlen}字母`;
                } else if (!prefix && suffix) {
                    label = `${wlen}字母+${suffix}`;
                } else {
                    label = `${prefix}+${wlen}字母+${suffix}`;
                }
            } else {
                const checked = Array.from(document.querySelectorAll('#config-brute input[type="checkbox"][value]:checked'))
                    .map(cb => cb.value).sort();
                label = checked.length ? checked.join('-') + '字母' : '自定义';
            }
            const blob = new Blob([list.join('\n')], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${label}.${tld}_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('success', `已导出 ${list.length} 个域名`, 2000);
        }

        // ================================================================
        // CONFETTI
        // ================================================================
        function spawnConfetti(count = 40) {
            const container = $('confetti-container');
            const colors = ['#00e5ff', '#10b981', '#f59e0b', '#ef4444', '#ff6bcb', '#38bdf8', '#a78bfa', '#f472b6'];

            for (let i = 0; i < count; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.top = -(Math.random() * 20 + 10) + 'px';
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.width = (Math.random() * 8 + 6) + 'px';
                piece.style.height = (Math.random() * 8 + 6) + 'px';
                piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
                piece.style.animationDelay = Math.random() * 0.8 + 's';
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                container.appendChild(piece);

                setTimeout(() => piece.remove(), 3500);
            }
        }

        // ================================================================
        // CONNECTION STATUS
        // ================================================================
        function updateConnStatus(status) {
            const dot = $('conn-dot');
            const text = $('conn-text');
            dot.className = 'conn-dot ' + status;
            const labels = { connected: '已连接', reconnecting: '重连中...', disconnected: '已断开' };
            text.textContent = labels[status] || '就绪';
        }

        // ================================================================
        // SAVE TO LOCALSTORAGE
        // ================================================================
        function saveToLocalStorage(domains) {
            try {
                const tld = $('tld').value;
                const data = {
                    tld: tld,
                    domains: domains,
                    timestamp: Date.now(),
                    config: getConfig(),
                };
                localStorage.setItem('domain_checker_last_results', JSON.stringify(data));
            } catch (e) { /* ignore */ }
        }

        // ================================================================
        // FINISH SCAN
        // ================================================================
        function finishScan() {
            if (eventSource) { eventSource.close(); eventSource = null; }
            resetUI();
            updateConnStatus('connected');
        }

        // ================================================================
        // CANCEL
        // ================================================================
        async function cancelScan() {
            if (!currentScanId) return;
            const btn = $('btn-cancel');
            if (btn.disabled) return; // 防止重复点击
            btn.disabled = true;
            btn.textContent = '⏳ 正在停止...';
            try {
                await authFetch(`/scan/cancel/${currentScanId}`, { method: 'POST' });
            } catch (err) {
                console.error('取消失败:', err);
            }
            // 关闭 SSE（后端不会再收到事件，直接本地重置 UI）
            if (eventSource) { eventSource.close(); eventSource = null; }
            scanningActive = false;
            currentScanId = null;
            // 已找到的域名保留在结果区(历史侧栏也会留下这条记录)
            $('progress-section').classList.remove('visible');
            $('scanning-hint').classList.remove('visible');
            $('results-area').classList.toggle('visible', foundDomains.length > 0);
            if (foundDomains.length > 0) {
                currentPage = 1;
                renderCurrentPage();
                saveToLocalStorage(foundDomains);
                loadHistory();
            }
            finishScan(); // 重置开始/停止按钮状态
            showToast('info', foundDomains.length > 0
                ? `扫描已停止，已保留 ${foundDomains.length} 个结果并记入历史`
                : '扫描已停止');
        }

        // ================================================================
        // RESET UI
        // ================================================================
        function resetUI() {
            $('btn-start').disabled = false;
            $('btn-start').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg> 开始扫描';
            $('btn-cancel').classList.add('hidden');
            $('btn-cancel').disabled = false;
            $('btn-cancel').textContent = '停止';
            scanningActive = false;
        }

        // ================================================================
        // INCREMENTAL RECHECK BANNER
        // ================================================================
        function showIncrementalBanner(skipped, fullCount, recheckCount) {
            const banner = $('incremental-banner');
            const text = $('incremental-text');
            const pct = fullCount > 0 ? Math.round(skipped / fullCount * 100) : 0;
            text.textContent = `⚡ 增量复检：跳过 ${skipped} 个已知注册域名（${pct}%），仅复检 ${recheckCount} 个`;
            banner.classList.add('visible');
            // auto dismiss after 12s
            clearTimeout(banner._timer);
            banner._timer = setTimeout(() => banner.classList.remove('visible'), 12000);
        }
        
        // ================================================================
        // HISTORY MODAL
        // ================================================================
        
        async function loadHistory() {
            const listEl = $('history-list');
            const emptyEl = $('history-empty');
            listEl.innerHTML = '';

            try {
                const resp = await authFetch('/history');
                const data = await resp.json();
                const items = data.items || [];

                $('history-count').textContent = `${items.length}`;

                if (items.length === 0) {
                    emptyEl.style.display = 'block';
                    listEl.style.display = 'none';
                    return;
                }
                emptyEl.style.display = 'none';
                listEl.style.display = 'block';

                const fmtTime = (ts) => {
                    if (!ts) return '';
                    const d = new Date(ts * 1000);
                    const now = new Date();
                    const diffMs = now - d;
                    const diffMin = Math.floor(diffMs / 60000);
                    if (diffMin < 1) return '刚刚';
                    if (diffMin < 60) return `${diffMin} 分钟前`;
                    const diffH = Math.floor(diffMin / 60);
                    if (diffH < 24) return `${diffH} 小时前`;
                    const diffD = Math.floor(diffH / 24);
                    if (diffD < 30) return `${diffD} 天前`;
                    return d.toLocaleDateString('zh-CN');
                };

                items.forEach(item => {
                    const modeLabel = item.mode === 'prefix_word' ? '单词' : '暴力';
                    const modeClass = item.mode === 'prefix_word' ? 'prefix' : 'brute';

                    // History item row
                    const el = document.createElement('div');
                    el.className = 'history-item';
                    el.dataset.id = item.id;
                    el.onclick = (e) => {
                        if (e.target.closest('.history-item-delete')) return;
                        toggleHistoryDetail(item.id);
                    };
                    el.innerHTML = `
                        <div class="history-item-main">
                            <div class="history-item-title">${escapeHtml(item.summary || '未知查询')}</div>
                            <div class="history-item-meta">
                                <span class="hi-tag ${modeClass}">${modeLabel}</span>
                                ${item.cancelled ? '<span class="hi-tag stopped">已停止</span>' : ''}
                                <span>${item.cancelled
                                    ? `已检测 ${item.checked || 0}/${item.total || 0}`
                                    : `${item.total || 0} 候选`}</span>
                                <span>${fmtTime(item.updated_at || item.created_at)}</span>
                            </div>
                        </div>
                        <div class="history-item-right">
                            <div class="history-item-stat">
                                <span class="hi-count">${item.available_count ?? 0}</span>
                                <span>可注册</span>
                            </div>
                            <button class="history-item-delete" title="删除" onclick="event.stopPropagation();deleteHistoryItem(${item.id})">🗑</button>
                        </div>
                    `;
                    listEl.appendChild(el);

                    // Detail placeholder (hidden by default)
                    const detail = document.createElement('div');
                    detail.className = 'history-detail';
                    detail.dataset.id = item.id;
                    listEl.appendChild(detail);
                });
            } catch (err) {
                listEl.innerHTML = '';
                emptyEl.style.display = 'block';
                emptyEl.querySelector('p').textContent = '加载失败: ' + err.message;
            }
        }

        async function toggleHistoryDetail(id) {
            const listEl = $('history-list');
            const detailEl = listEl.querySelector(`.history-detail[data-id="${id}"]`);
            if (!detailEl) return;

            // If already open — close it and un-collapse all
            if (detailEl.classList.contains('open')) {
                detailEl.classList.remove('open');
                detailEl.innerHTML = '';
                listEl.querySelectorAll('.history-item').forEach(el => el.classList.remove('collapsed'));
                return;
            }

            // Close all other details, collapse all items
            listEl.querySelectorAll('.history-detail.open').forEach(el => {
                el.classList.remove('open');
                el.innerHTML = '';
            });
            listEl.querySelectorAll('.history-item').forEach(el => el.classList.add('collapsed'));

            // Open this detail, un-collapse its parent item
            detailEl.classList.add('open');
            detailEl.innerHTML = '<div style="text-align:center;padding:12px;color:var(--text-muted);">⏳ 加载中...</div>';
            const parentItem = listEl.querySelector(`.history-item[data-id="${id}"]`);
            if (parentItem) parentItem.classList.remove('collapsed');
            detailEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            try {
                const resp = await authFetch(`/history/${id}`);
                const rec = await resp.json();
                if (rec.error) {
                    detailEl.innerHTML = `<div style="color:var(--error);padding:8px;">${rec.error}</div>`;
                    return;
                }
                const avail = rec.available_list || [];
                const fmtTime = (ts) => {
                    if (!ts) return '';
                    return new Date(ts * 1000).toLocaleString('zh-CN');
                };
                detailEl.innerHTML = `
                    <div class="history-detail-header">
                        <span>${escapeHtml(rec.summary || '')}</span>
                        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();copyAllFromHistory(${id})">📋 复制全部</button>
                    </div>
                    <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">
                        ${rec.total || 0} 候选 → ${avail.length} 可注册
                        ${rec.cancelled ? `&nbsp;·&nbsp; <span style="color:var(--warning,#f59e0b);">已停止（已检测 ${rec.checked || 0}，结果为部分）</span>` : ''}
                        &nbsp;·&nbsp; ${fmtTime(rec.updated_at || rec.created_at)}
                    </div>
                    <div class="hi-available-list">
                        ${avail.length === 0 ? '<span style="color:var(--text-muted);background:transparent;">无</span>' :
                            avail.map(d => `<span>${escapeHtml(d)}</span>`).join('')}
                    </div>
                `;
                detailEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } catch (err) {
                detailEl.innerHTML = `<div style="color:var(--error);padding:8px;">加载失败: ${err.message}</div>`;
            }
        }

        async function deleteHistoryItem(id) {
            if (!confirm('确定删除这条历史记录？')) return;
            try {
                const resp = await authFetch(`/history/delete/${id}`, { method: 'POST' });
                if (resp.ok) {
                    showToast('success', '已删除', 2000);
                    await loadHistory();
                } else {
                    showToast('error', '删除失败');
                }
            } catch (err) {
                showToast('error', '删除失败: ' + err.message);
            }
        }

        async function copyAllFromHistory(id) {
            try {
                const resp = await authFetch(`/history/${id}`);
                const rec = await resp.json();
                const avail = rec.available_list || [];
                if (avail.length === 0) {
                    showToast('info', '没有可复制的域名');
                    return;
                }
                const text = avail.join('\n');
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                }
                showToast('success', `已复制 ${avail.length} 个域名`, 2500);
            } catch (err) {
                showToast('error', '复制失败');
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ================================================================
        // THEME TOGGLE
        // ================================================================
        function initTheme() {
            const saved = localStorage.getItem('dc-theme');
            const theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.dataset.theme = theme;
            updateThemeIcon(theme);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
            html.dataset.theme = next;
            localStorage.setItem('dc-theme', next);
            updateThemeIcon(next);
        }

        function updateThemeIcon(theme) {
            const icon = $('theme-icon');
            if (icon) icon.textContent = theme === 'dark' ? '🌙' : '☀️';
        }

        // ================================================================
        // KEYBOARD SHORTCUTS
        // ================================================================
        document.addEventListener('keydown', (e) => {
            // Ctrl+K / Cmd+K: focus filter
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                $('results-filter').focus();
                return;
            }
            // Ctrl+Shift+C: copy all
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'C') {
                e.preventDefault();
                copyAllDomains();
                return;
            }
            // Escape: cancel scan
            if (e.key === 'Escape' && scanningActive) {
                e.preventDefault();
                cancelScan();
                return;
            }
            // Enter: start scan (when not in an input that would conflict)
            if (e.key === 'Enter' && !scanningActive) {
                const active = document.activeElement;
                if (!active || active.tagName === 'BODY' || active.closest('.card') === $('config-card')) {
                    e.preventDefault();
                    startScan();
                }
            }
        });
    </script>
</body>
</html>
