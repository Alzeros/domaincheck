    <script>
        // ================================================================
        // STATE
        // ================================================================
        let currentScanId = null;
        let eventSource = null;
        let foundDomains = [];
        let scanningActive = false;
        let currentMode = 'brute';
        let currentSort = 'default';
        let scanStartTime = null;
        let lastChecked = 0;
        let lastCheckTime = 0;
        let totalDomains = 0;

        // Pagination
        const PAGE_SIZE = 100;
        let currentPage = 1;

        // ================================================================
        // DOM REFS
        // ================================================================
        const $ = id => document.getElementById(id);

        // ================================================================
        // TOAST SYSTEM
        // ================================================================
        function showToast(type, message, duration = 4000) {
            const container = $('toast-container');
            const icons = { success: '', error: '', warning: '', info: '' };
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <span class="toast-icon">${icons[type] || ''}</span>
                <span class="toast-message">${message}</span>
                <button class="toast-close" onclick="this.closest('.toast').remove()">✕</button>
                <div class="toast-timer"></div>
            `;
            container.appendChild(toast);

            const remove = () => {
                if (toast.parentElement) {
                    toast.classList.add('removing');
                    setTimeout(() => toast.remove(), 250);
                }
            };

            const timer = setTimeout(remove, duration);
            toast.querySelector('.toast-close').addEventListener('click', () => {
                clearTimeout(timer);
                remove();
            });
        }

        // ================================================================
        // MODE SWITCHING
        // ================================================================
        function setMode(mode) {
            currentMode = mode;
            $('config-brute').classList.toggle('hidden', mode !== 'brute');
            $('config-prefix').classList.toggle('hidden', mode !== 'prefix');

            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.dataset.mode === mode);
            });
        }

        // ================================================================
        // TLD PICKER
        // ================================================================
        let tldGroup = "core";
        try {
            const savedGroup = localStorage.getItem("dc-tld-tab");
            if (savedGroup && document.querySelector('#tld-tabs .tld-tab[data-group="' + savedGroup + '"]')) {
                tldGroup = savedGroup;
            }
        } catch (e) {}

        // ── 快捷行数据源:收藏 + 最近使用 ──
        const TLD_STAR_DEFAULTS = ["de", "com", "net", "org", "io", "xyz"];
        let tldStars = (() => {
            try {
                const raw = localStorage.getItem("dc-tld-starred");
                if (raw === null) return TLD_STAR_DEFAULTS.slice(); // 首次使用给一组默认收藏
                const arr = JSON.parse(raw);
                return Array.isArray(arr) ? arr.filter(t => typeof t === "string") : [];
            } catch (e) { return TLD_STAR_DEFAULTS.slice(); }
        })();
        let tldRecents = (() => {
            try {
                const arr = JSON.parse(localStorage.getItem("dc-tld-recent") || "[]");
                return Array.isArray(arr) ? arr.filter(t => typeof t === "string") : [];
            } catch (e) { return []; }
        })();
        let tldFullOpen = false;
        let tldSearchForcedOpen = false;

        function persistTldMeta() {
            try {
                localStorage.setItem("dc-tld-starred", JSON.stringify(tldStars));
                localStorage.setItem("dc-tld-recent", JSON.stringify(tldRecents));
            } catch (e) {}
        }

        function pushRecentTld(tld) {
            tldRecents = [tld, ...tldRecents.filter(t => t !== tld)].slice(0, 4);
            persistTldMeta();
        }

        function isStarred(tld) { return tldStars.includes(tld); }

        function toggleStarTld(tld) {
            if (isStarred(tld)) tldStars = tldStars.filter(t => t !== tld);
            else tldStars = [...tldStars, tld];
            persistTldMeta();
            injectPillStars();
            renderTldQuick();
        }

        // 给完整列表里的每个 pill 注入收藏星标(幂等)
        function injectPillStars() {
            document.querySelectorAll("#tld-pills .pill").forEach(p => {
                let star = p.querySelector(".pill-star");
                if (!star) {
                    star = document.createElement("span");
                    star.className = "pill-star";
                    star.textContent = "★";
                    p.appendChild(star);
                }
                star.classList.toggle("on", isStarred(p.dataset.tld));
            });
        }

        // 快捷行:收藏在前,最近使用补后(去重)
        function renderTldQuick() {
            const wrap = $("tld-quick");
            const current = $("tld").value;
            const quick = [...tldStars];
            for (const t of tldRecents) {
                if (quick.length >= 10) break;
                if (!quick.includes(t)) quick.push(t);
            }
            wrap.innerHTML = "";
            if (quick.length === 0) {
                const hint = document.createElement("span");
                hint.className = "qlabel";
                hint.textContent = "点「全部后缀」选择,或在完整列表里点 ★ 收藏常用后缀";
                wrap.appendChild(hint);
                return;
            }
            for (const t of quick) {
                const b = document.createElement("button");
                b.type = "button";
                b.className = "pill" + (t === current ? " selected" : "");
                b.dataset.tld = t;
                b.innerHTML = (isStarred(t) ? '<span class="qstar">★</span>' : "") + "." + t;
                wrap.appendChild(b);
            }
        }

        function setTldFull(open) {
            tldFullOpen = open;
            $("tld-full").hidden = !open;
            const more = $("tld-more");
            more.classList.toggle("open", open);
            more.innerHTML = open
                ? '收起列表 <span class="chev">▾</span>'
                : '全部后缀 <span class="chev">▾</span>';
            if (open) injectPillStars();
        }

        function syncTldCurrent(tld) {
            const label = document.getElementById("tld-current");
            if (label) label.textContent = "." + tld;
        }

        function selectTld(tld) {
            document.querySelectorAll("#tld-pills .pill").forEach(p => {
                p.classList.toggle("selected", p.dataset.tld === tld);
            });
            document.querySelectorAll("#tld-quick .pill").forEach(p => {
                p.classList.toggle("selected", p.dataset.tld === tld);
            });
            $("tld").value = tld;
            syncTldCurrent(tld);
            pushRecentTld(tld);
            renderTldQuick();
        }

        function renderTldPicker() {
            const raw = ($("tld-search").value || "").trim().toLowerCase().replace(/^\./, "");
            document.querySelectorAll("#tld-tabs .tld-tab").forEach(tab => {
                tab.classList.toggle("is-on", !raw && tab.dataset.group === tldGroup);
            });
            let shown = 0;
            document.querySelectorAll("#tld-pills .pill").forEach(pill => {
                const hit = !raw
                    ? pill.dataset.group === tldGroup
                    : pill.dataset.tld.includes(raw);
                pill.hidden = !hit;
                if (hit) shown += 1;
            });
            const empty = document.getElementById("tld-empty");
            if (empty) empty.hidden = shown !== 0;
        }

        document.getElementById("tld-tabs").addEventListener("click", (e) => {
            const tab = e.target.closest(".tld-tab");
            if (!tab) return;
            tldGroup = tab.dataset.group;
            try { localStorage.setItem("dc-tld-tab", tldGroup); } catch (err) {}
            $("tld-search").value = "";
            renderTldPicker();
        });

        $("tld-search").addEventListener("input", () => {
            renderTldPicker();
            const has = $("tld-search").value.trim().length > 0;
            // 搜索需要看到完整列表:非空自动展开,清空后恢复原状
            if (has && !tldFullOpen) { tldSearchForcedOpen = true; setTldFull(true); }
            if (!has && tldSearchForcedOpen) { tldSearchForcedOpen = false; setTldFull(false); }
        });

        document.getElementById("tld-more").addEventListener("click", () => {
            tldSearchForcedOpen = false;
            setTldFull(!tldFullOpen);
        });

        document.getElementById("tld-pills").addEventListener("click", (e) => {
            const star = e.target.closest(".pill-star");
            if (star) {
                toggleStarTld(star.parentElement.dataset.tld);
                return;
            }
            const pill = e.target.closest(".pill");
            if (!pill || pill.hidden) return;
            selectTld(pill.dataset.tld);
            if ($("tld-search").value.trim()) {
                tldGroup = pill.dataset.group;
                try { localStorage.setItem("dc-tld-tab", tldGroup); } catch (err) {}
                $("tld-search").value = "";
                renderTldPicker();
            }
        });

        document.getElementById("tld-quick").addEventListener("click", (e) => {
            const pill = e.target.closest(".pill");
            if (!pill) return;
            selectTld(pill.dataset.tld);
        });

        renderTldPicker();
        setTldFull(false);
        renderTldQuick();
        syncTldCurrent($("tld").value || "de");

        // ================================================================
        // INIT
        // ================================================================
        // ================================================================
        // AUTH
        // ================================================================
        let authToken = localStorage.getItem('dc-token') || '';

        function authFetch(url, options = {}) {
            if (authToken) {
                options.headers = options.headers || {};
                if (options.headers instanceof Headers) {
                    options.headers.set('Authorization', `Bearer ${authToken}`);
                } else {
                    options.headers['Authorization'] = `Bearer ${authToken}`;
                }
            }
            return fetch(url, options);
        }

        async function doLogin() {
            const pw = $('login-password').value;
            if (!pw) return;
            try {
                const resp = await fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pw }),
                });
                const data = await resp.json();
                if (data.ok) {
                    authToken = data.token || '';
                    if (authToken) localStorage.setItem('dc-token', authToken);
                    $('login-overlay').classList.remove('visible');
                    initApp();
                } else {
                    $('login-error').textContent = data.error || '密码错误';
                    $('login-error').classList.add('visible');
                }
            } catch (err) {
                $('login-error').textContent = '连接失败';
                $('login-error').classList.add('visible');
            }
        }

        // Enter key on password input
        document.addEventListener('DOMContentLoaded', () => {
            $('login-password').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') doLogin();
            });
        });

        async function checkAuth() {
            try {
                const resp = await fetch('/auth/check');
                const data = await resp.json();
                if (!data.need_auth) {
                    initApp();
                    return;
                }
                // Need auth — check if stored token is valid
                if (authToken) {
                    const test = await authFetch('/history?limit=1');
                    if (test.ok) {
                        initApp();
                        return;
                    }
                    // Token expired
                    authToken = '';
                    localStorage.removeItem('dc-token');
                }
                // Show login
                $('login-overlay').classList.add('visible');
                $('login-password').focus();
            } catch (err) {
                // Server unreachable, show login
                $('login-overlay').classList.add('visible');
            }
        }

        function initApp() {
            initTheme();
            restoreLastResults();
            restoreLastResultsFromServer();
            checkActiveScan();
            loadWordMeta();
            setMode('prefix');
            setTimeout(loadHistory, 300);

            // 前缀/后缀开关直接控制输入框可用性，留空即「无」——
            // 取代旧版「@=无」的双轨约定
            const syncAffix = () => {
                $('prefix').disabled = !$('use-prefix').checked;
                $('suffix').disabled = !$('use-suffix').checked;
            };
            $('use-prefix').addEventListener('change', syncAffix);
            $('use-suffix').addEventListener('change', syncAffix);
            syncAffix();

            $('prefix').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !scanningActive) startScan();
            });
            $('suffix').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !scanningActive) startScan();
            });
        }

        window.addEventListener('DOMContentLoaded', checkAuth);

        // ================================================================
        // WORD META
        // ================================================================
        let wordMetaData = null;

        async function refreshWordMeta() {
            try {
                const resp = await authFetch('/words-meta');
                wordMetaData = await resp.json();
                updateWordInfo();
            } catch (e) {
                $('word-count-info').textContent = '无法加载词表';
            }
        }

        function updateWordInfo() {
            if (!wordMetaData) return;
            const len = $('word-length').value;
            const onlyCustom = $('only-custom').checked;
            const onlyCommon = $('only-common').checked;
            const info = wordMetaData[len] || { total: 0, common_count: 0, custom_count: 0 };
            const scope = onlyCustom ? `自定义词 ${info.custom_count ?? 0} 个`
                : onlyCommon ? `单词可用 ${info.total} 个（常用 ${info.common_count} 个）`
                : `单词可用 ${info.total} 个`;
            const count = onlyCustom ? (info.custom_count ?? 0)
                : onlyCommon ? info.common_count : info.total;
            const useP = $('use-prefix').checked;
            const useS = $('use-suffix').checked;
            const rawP = useP ? $('prefix').value.trim().toLowerCase() : '';
            const rawS = useS ? $('suffix').value.trim().toLowerCase() : '';
            const hasPrefix = useP && rawP !== '' && rawP !== '@';
            const hasSuffix = useS && rawS !== '' && rawS !== '@';

            let affix = '无前后缀';
            if (hasPrefix && hasSuffix) affix = `前缀: ${rawP}, 后缀: ${rawS}`;
            else if (hasPrefix) affix = `前缀: ${rawP}`;
            else if (hasSuffix) affix = `后缀: ${rawS}`;

            $('word-count-info').textContent =
                `${len}字母${scope}，将扫描 ${count} 个域名（${affix}）`;
        }

        async function loadWordMeta() {
            await refreshWordMeta();
            $('word-length').addEventListener('change', updateWordInfo);
            // 「仅常用词」与「仅自定义词」互斥:勾一个自动取消另一个
            $('only-common').addEventListener('change', () => {
                if ($('only-common').checked) $('only-custom').checked = false;
                updateWordInfo();
            });
            $('only-custom').addEventListener('change', () => {
                if ($('only-custom').checked) $('only-common').checked = false;
                updateWordInfo();
            });
            $('use-prefix').addEventListener('change', updateWordInfo);
            $('use-suffix').addEventListener('change', updateWordInfo);
            $('prefix').addEventListener('input', updateWordInfo);
            $('suffix').addEventListener('input', updateWordInfo);
        }

        // ================================================================
        // WORD MODAL — 词表管理(查看/搜索/停用/添加自定义/恢复默认)
        // ================================================================
        let wmItems = [];
        let wmMeta = {};
        let wmFilter = "all";

        function openWordModal() {
            $("word-modal").hidden = false;
            $("wm-length").value = $("word-length").value;
            wmLoad();
        }

        function closeWordModal() {
            $("word-modal").hidden = true;
            // 面板里切过词长的话,同步回扫描表单
            if ($("wm-length").value !== $("word-length").value) {
                $("word-length").value = $("wm-length").value;
                $("word-length").dispatchEvent(new Event("change"));
            }
        }

        async function wmLoad() {
            const len = $("wm-length").value;
            $("wm-length-label").textContent = "· " + len + " 字母";
            $("wm-add-input").placeholder = "添加自定义 " + len + " 字母单词";
            try {
                const resp = await authFetch(`/words/${len}/manage`);
                wmMeta = await resp.json();
                wmItems = wmMeta.items || [];
                // 默认全部按首字母收起,只留一行组头作概览
                wmCollapsed = new Set(wmItems.map(i => i.w[0].toUpperCase()));
                wmRender();
            } catch (e) {
                $("wm-stats").textContent = "词表加载失败";
            }
        }

        async function wmPost(body) {
            const len = $("wm-length").value;
            try {
                const resp = await authFetch(`/words/${len}/manage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                });
                wmMeta = await resp.json();
                wmItems = wmMeta.items || [];
                wmRender();
                refreshWordMeta(); // 同步表单里的「将扫描 N 个域名」
            } catch (e) {
                showToast("error", "保存失败: " + e.message);
            }
        }

        const WM_GROUP_THRESHOLD = 60; // 词数不超过该值则平铺,不分字母组
        let wmCollapsed = new Set();   // 处于收起状态的首字母

        function wmMakeChip(it) {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "wchip"
                + (it.common ? " common" : "")
                + (it.added ? " added" : "")
                + (it.disabled ? " off" : "");
            b.dataset.w = it.w;
            b.title = it.disabled ? "点击启用" : "点击停用";
            b.innerHTML = '<span class="dotc"></span>' + it.w
                + (it.added ? ' <span class="wmx" title="删除自定义词">×</span>' : "");
            return b;
        }

        function updateWmExpandAll() {
            const btn = $("wm-expand-all");
            const grouped = wmItems.length > WM_GROUP_THRESHOLD;
            const forceOpen = ($("wm-search").value || "").trim() || wmFilter !== "all";
            btn.hidden = !grouped || !!forceOpen;
            if (!btn.hidden) {
                btn.textContent = wmCollapsed.size ? "全部展开" : "全部收起";
            }
        }

        function wmRender() {
            const len = $("wm-length").value;
            const m = wmMeta;
            const disabledCount = wmItems.filter(i => i.disabled).length;
            const addedCount = wmItems.filter(i => i.added).length;
            $("wm-length-label").textContent = "· " + len + " 字母";
            $("wm-stats").textContent =
                `可用 ${m.enabled_total ?? "?"} / 共 ${m.total ?? "?"} · 常用 ${m.enabled_common ?? "?"} · 已停用 ${disabledCount} · 自定义 ${addedCount}`;

            const q = ($("wm-search").value || "").trim().toLowerCase();
            const chips = $("wm-chips");
            const prevScroll = chips.scrollTop;

            // 过滤
            const matched = wmItems.filter(it => {
                if (wmFilter === "common" && !it.common) return false;
                if (wmFilter === "uncommon" && it.common) return false;
                if (wmFilter === "disabled" && !it.disabled) return false;
                if (wmFilter === "added" && !it.added) return false;
                if (q && !it.w.includes(q)) return false;
                return true;
            });

            // 搜索/过滤时强制展开所有组,避免匹配结果被折叠藏住
            const forceOpen = !!q || wmFilter !== "all";
            const grouped = wmItems.length > WM_GROUP_THRESHOLD;

            chips.innerHTML = "";
            let shown = 0;

            if (!grouped) {
                for (const it of matched) {
                    chips.appendChild(wmMakeChip(it));
                    shown += 1;
                }
            } else {
                // 按首字母分组,A→Z;组内保持原顺序(常用在前)
                const groups = new Map();
                for (const it of matched) {
                    const letter = it.w[0].toUpperCase();
                    if (!groups.has(letter)) groups.set(letter, []);
                    groups.get(letter).push(it);
                }
                for (const [letter, items] of groups) {
                    shown += items.length;
                    const g = document.createElement("div");
                    g.className = "wgroup";
                    g.dataset.letter = letter;
                    const collapsed = !forceOpen && wmCollapsed.has(letter);
                    const head = document.createElement("button");
                    head.type = "button";
                    head.className = "wgroup-head" + (collapsed ? "" : " open");
                    head.innerHTML =
                        `<span class="chev">▶</span>` +
                        `<span class="wgroup-letter">${letter}</span>` +
                        `<span class="wgroup-count">${items.length} 个</span>`;
                    const body = document.createElement("div");
                    body.className = "wgroup-body";
                    body.hidden = collapsed;
                    for (const it of items) body.appendChild(wmMakeChip(it));
                    g.appendChild(head);
                    g.appendChild(body);
                    chips.appendChild(g);
                }
            }

            if (shown === 0) {
                chips.innerHTML = '<span style="color:var(--text-muted);font-size:13px;">没有匹配的单词</span>';
            } else {
                chips.scrollTop = prevScroll; // 保持滚动位置(停用/启用单个词后不跳顶)
            }
            updateWmExpandAll();
        }

        // 点组头 = 折叠/展开该字母组(原地切换,不重渲染)
        // 点词 = 停用/启用切换;点 × = 删除自定义词
        $("wm-chips").addEventListener("click", (e) => {
            const head = e.target.closest(".wgroup-head");
            if (head) {
                const group = head.parentElement;
                const body = group.querySelector(".wgroup-body");
                const nowCollapsed = !body.hidden;
                body.hidden = nowCollapsed;
                head.classList.toggle("open", !nowCollapsed);
                if (nowCollapsed) wmCollapsed.add(group.dataset.letter);
                else wmCollapsed.delete(group.dataset.letter);
                updateWmExpandAll();
                return;
            }
            const chip = e.target.closest(".wchip");
            if (!chip) return;
            const w = chip.dataset.w;
            const item = wmItems.find(i => i.w === w);
            if (!item) return;
            if (e.target.classList.contains("wmx")) {
                wmPost({ remove_added: [w] });
                return;
            }
            wmPost(item.disabled ? { enable: [w] } : { disable: [w] });
        });

        $("wm-filters").addEventListener("click", (e) => {
            const btn = e.target.closest(".btn-sort");
            if (!btn) return;
            wmFilter = btn.dataset.wf;
            document.querySelectorAll("#wm-filters .btn-sort")
                .forEach(b => b.classList.toggle("active", b === btn));
            wmRender();
        });

        $("wm-search").addEventListener("input", wmRender);
        $("wm-length").addEventListener("change", wmLoad);

        // 全部展开/收起:有任一组收起时按钮为「全部展开」
        $("wm-expand-all").addEventListener("click", () => {
            if (wmCollapsed.size) wmCollapsed.clear();
            else wmItems.forEach(it => wmCollapsed.add(it.w[0].toUpperCase()));
            wmRender();
        });

        function wmAdd() {
            const input = $("wm-add-input");
            const len = parseInt($("wm-length").value, 10);
            const w = (input.value || "").trim().toLowerCase();
            if (!/^[a-z]+$/.test(w)) { showToast("warning", "只能包含字母 a-z"); return; }
            if (w.length !== len) { showToast("warning", `需要正好 ${len} 个字母`); return; }
            wmPost({ add: [w] });
            input.value = "";
        }

        async function wmReset() {
            const len = $("wm-length").value;
            if (!confirm(`恢复 ${len} 字母词表的默认配置?(停用与自定义词都会清空)`)) return;
            await wmPost({ reset: true });
        }

        $("wm-add-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter") wmAdd();
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && !$("word-modal").hidden) closeWordModal();
        });
        $("word-modal").addEventListener("click", (e) => {
            if (e.target === $("word-modal")) closeWordModal();
        });

        // ================================================================
        // RESTORE FROM LOCALSTORAGE
        // ================================================================
        function restoreLastResults() {
            try {
                const saved = localStorage.getItem('domain_checker_last_results');
                if (!saved) return;
                const data = JSON.parse(saved);
                const elapsed = Date.now() - data.timestamp;
                if (elapsed > 3600_000) return;

                const tld = data.tld || '';
                const count = data.domains ? data.domains.length : 0;
                const timeStr = new Date(data.timestamp).toLocaleTimeString('zh-CN');

                $('restore-text').textContent =
                    `上次扫描 (.${tld}) 在 ${timeStr} 完成，找到 ${count} 个可注册域名`;
                $('restore-banner').classList.add('visible');

                if (data.domains && data.domains.length > 0) {
                    renderAllResults(data.domains, false);
                    $('results-count').textContent = `${data.domains.length}`;
                }
            } catch (e) { /* ignore */ }
        }

        function dismissRestore() {
            $('restore-banner').classList.remove('visible');
        }

        // ================================================================
        // CHECK ACTIVE SCAN (reconnection)
        // ================================================================
        async function checkActiveScan() {
            try {
                const resp = await authFetch('/scan/active');
                const data = await resp.json();
                if (!data.scan_id) return;

                $('restore-text').textContent =
                    `🔴 扫描进行中 (.${data.tld})：已检测 ${data.checked}/${data.total}（${data.pct}%），耗时 ${data.elapsed}s`;
                $('restore-banner').classList.add('visible');

                const btn = document.createElement('button');
                btn.className = 'btn btn-primary btn-sm';
                btn.textContent = '继续查看';
                btn.onclick = reconnectScan;
                $('restore-action').appendChild(btn);

                currentScanId = data.scan_id;
            } catch (e) { /* ignore */ }
        }

        async function reconnectScan() {
            if (!currentScanId) return;
            dismissRestore();

            foundDomains = [];
            $('results-grid').innerHTML = '';

            $('progress-section').classList.add('visible');
            $('results-area').classList.add('visible');
            $('results-empty').classList.remove('visible');
            $('scanning-hint').classList.add('visible');
            $('btn-start').disabled = true;
            $('btn-start').innerHTML = '扫描中…';
            $('btn-cancel').classList.remove('hidden');

            const resp = await authFetch(`/scan/results/${currentScanId}`);
            const state = await resp.json();
            if (state.available && state.available.length > 0) {
                for (const d of state.available) addFoundDomain(d);
            }

            const total = state.total || 0;
            connectSSE(currentScanId, total);
        }

        // ================================================================
        // RESTORE FROM SERVER
        // ================================================================
        async function restoreLastResultsFromServer() {
            try {
                if ($('restore-banner').classList.contains('visible')) return;

                const resp = await authFetch('/scan/last');
                const data = await resp.json();
                if (!data.domains || data.domains.length === 0) return;

                const elapsed = Date.now() - (data.timestamp * 1000 || 0);
                if (elapsed > 3600_000) return;

                const count = data.domains.length;
                const timeStr = new Date(data.timestamp * 1000).toLocaleTimeString('zh-CN');

                $('restore-text').textContent =
                    `上次扫描 (.${data.tld}) 在 ${timeStr} 完成，找到 ${count} 个可注册域名`;
                $('restore-banner').classList.add('visible');

                renderAllResults(data.domains, false);
                $('results-count').textContent = `${data.domains.length}`;
            } catch (e) { /* ignore */ }
        }

        // ================================================================
        // CONFIG
        // ================================================================
        function getConfig() {
            const tld = $('tld').value;

            if (currentMode === 'prefix') {
                const rawP = $('prefix').value.trim().toLowerCase();
                const rawS = $('suffix').value.trim().toLowerCase();
                const useP = $('use-prefix').checked;
                const useS = $('use-suffix').checked;
                // 未启用或 @/空 均视为无前缀/无后缀
                const prefix = (useP && rawP !== '' && rawP !== '@') ? rawP : '';
                const suffix = (useS && rawS !== '' && rawS !== '@') ? rawS : '';
                const wordLength = parseInt($('word-length').value);
                const onlyCustom = $('only-custom').checked;
                const onlyCommon = $('only-common').checked && !onlyCustom;
                return { mode: 'prefix_word', tld, prefix, suffix, word_length: wordLength, only_common: onlyCommon, only_custom: onlyCustom };
            }

            const lengths = Array.from(
                document.querySelectorAll('#config-brute input[type="checkbox"][value]:checked')
            ).map(cb => parseInt(cb.value)).filter(v => !isNaN(v)).sort();
            const useDigits = $('use-digits').checked;
            return { mode: 'brute', tld, lengths, use_digits: useDigits };
        }

        function validateConfig(cfg) {
            if (cfg.mode === 'brute' && (!cfg.lengths || cfg.lengths.length === 0)) {
                showToast('warning', '请至少选择一个域名长度');
                return false;
            }
            if (cfg.mode === 'prefix_word' && cfg.only_custom) {
                const info = (wordMetaData || {})[cfg.word_length] || {};
                if (!info.custom_count) {
                    showToast('warning', `${cfg.word_length} 字母词表还没有自定义词，请先在「管理词表」中添加`);
                    return false;
                }
            }
            return true;
        }

        // ================================================================
        // START SCAN
        // ================================================================
        async function startScan() {
            const cfg = getConfig();
            if (!cfg || !validateConfig(cfg)) return;

            if (eventSource) { eventSource.close(); eventSource = null; }

            foundDomains = [];
            scanningActive = true;
            currentSort = 'default';
            dismissRestore();

            // Reset UI
            $('btn-start').disabled = true;
            $('btn-start').innerHTML = '扫描中…';
            $('btn-cancel').classList.remove('hidden');
            $('progress-section').classList.add('visible');
            $('results-area').classList.add('visible');

            // Reset progress
            $('progress-fill').style.width = '0%';
            $('progress-pct-large').textContent = '0%';
            updateRing(0);
            $('stat-checked').textContent = '0';
            $('stat-whois').textContent = '0';
            $('stat-found').textContent = '0';
            $('stat-elapsed').textContent = '0s';
            $('speed-info').textContent = '准备中…';
            $('eta-info').textContent = '';
            $('stat-found-card').classList.remove('has-results');

            // Reset results
            $('results-grid').innerHTML = '';
            $('results-empty').classList.remove('visible');
            $('scanning-hint').classList.add('visible');
            $('results-count').textContent = '0';
            $('results-filter').value = '';
            $('filter-clear').classList.remove('visible');

            // Reset sort buttons
            document.querySelectorAll('.btn-sort').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-sort="default"]').classList.add('active');

            // Set connection status
            updateConnStatus('connected');

            try {
                const resp = await authFetch('/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cfg),
                });
                const data = await resp.json();
                if (data.error) {
                    showToast('error', data.error);
                    resetUI();
                    return;
                }
                currentScanId = data.scan_id;
                totalDomains = data.total;
                scanStartTime = Date.now();
                lastChecked = 0;
                lastCheckTime = Date.now();

                // Show incremental banner if applicable
                if (data.incremental && data.skipped > 0) {
                    showIncrementalBanner(data.skipped, data.full_count, data.total);
                }

                connectSSE(currentScanId, data.total);
            } catch (err) {
                showToast('error', '启动失败: ' + err.message);
                resetUI();
            }
        }

        // ================================================================
        // SSE CONNECTION
        // ================================================================
        function connectSSE(scanId, total) {
            const sseUrl = authToken ? `/scan/events/${scanId}?token=${authToken}` : `/scan/events/${scanId}`;
            eventSource = new EventSource(sseUrl);

            eventSource.addEventListener('progress', (e) => {
                const data = JSON.parse(e.data);
                const pct = data.pct || 0;
                $('progress-fill').style.width = pct + '%';
                updateRing(pct);
                $('progress-pct-large').textContent = pct.toFixed(1) + '%';
                $('stat-checked').textContent = data.checked;
                if (data.whois_queried !== undefined) {
                    $('stat-whois').textContent = data.whois_queried;
                }

                // Speed & ETA
                const now = Date.now();
                const checked = data.checked;
                const elapsed = (now - scanStartTime) / 1000;
                $('stat-elapsed').textContent = elapsed.toFixed(1) + 's';

                if (elapsed > 0.5 && checked > 0) {
                    const speed = (checked / elapsed).toFixed(1);
                    $('speed-info').textContent = `~${speed} 域名/秒`;
                    if (checked < total && speed > 0) {
                        const remaining = total - checked;
                        const eta = Math.ceil(remaining / parseFloat(speed));
                        $('eta-info').textContent = `预计剩余 ${eta}s`;
                    }
                }
            });

            eventSource.addEventListener('snapshot', (e) => {
                const data = JSON.parse(e.data);
                if (data.checked > 0) {
                    const pct = data.total > 0 ? (data.checked / data.total * 100) : 0;
                    $('progress-fill').style.width = pct + '%';
                    updateRing(pct);
                    $('progress-pct-large').textContent = pct.toFixed(1) + '%';
                    $('stat-checked').textContent = data.checked;
                }
            });

            eventSource.addEventListener('found', (e) => {
                const data = JSON.parse(e.data);
                addFoundDomain(data.domain);
                $('stat-found').textContent = foundDomains.length;
                $('stat-found-card').classList.add('has-results');

                // Confetti on first find
            });

            eventSource.addEventListener('ratelimit', (e) => {
                const data = JSON.parse(e.data);
                showToast('warning', `检测到限流，自动降速至每批间隔 ${data.sleep}s`, 3000);
            });

            eventSource.addEventListener('retry', (e) => {
                const data = JSON.parse(e.data);
                showToast('warning', `${data.count} 个域名因限流未能确认，等待 ${data.wait}s 后自动复检`, 5000);
            });

            eventSource.addEventListener('done', (e) => {
                scanningActive = false;
                const data = JSON.parse(e.data);
                $('progress-fill').style.width = '100%';
                updateRing(100);
                $('progress-pct-large').textContent = '100%';
                $('scanning-hint').classList.remove('visible');

                if (data.cancelled) {
                    showToast('warning', '扫描已停止');
                    loadHistory();
                    if (foundDomains.length === 0) {
                        setEmptyState('stopped-zero', { checked: data.total_checked });
                    }
                } else {
                    const count = data.available_count || foundDomains.length;
                    showToast('success', `扫描完成！共检测 ${data.total_checked} 个域名，找到 ${count} 个可注册域名`);
                    if (count === 0) {
                        setEmptyState('zero', { total: data.total_checked });
                    }
                    loadHistory();
                }

                $('stat-elapsed').textContent = (data.elapsed || 0) + 's';
                $('stat-found').textContent = data.available_count || foundDomains.length;
                $('results-count').textContent = `${data.available_count || foundDomains.length}`;

                // Switch to paginated view
                currentPage = 1;
                renderCurrentPage();

                saveToLocalStorage(foundDomains);
                finishScan();
            });

            eventSource.addEventListener('error', (e) => {
                scanningActive = false;
                $('scanning-hint').classList.remove('visible');
                if (e.data) {
                    const data = JSON.parse(e.data);
                    showToast('error', data.message || '扫描出错');
                }
                updateConnStatus('disconnected');
                finishScan();
            });

            eventSource.addEventListener('heartbeat', () => {});
        }

        // ================================================================
        // PROGRESS RING
        // ================================================================
        function updateRing(pct) {
            const circle = $('progress-ring-fill');
            const circumference = 2 * Math.PI * 52; // ~326.73
            const offset = circumference - (pct / 100) * circumference;
            circle.style.strokeDashoffset = offset;
        }

        // ================================================================
        // ADD FOUND DOMAIN (live scan — append card directly)
        // ================================================================
        function addFoundDomain(domain) {
            foundDomains.push(domain);
            const parts = domain.split('.');
            const name = parts[0];

                    </button>

        // ================================================================
        // PAGINATION — getFilteredDomains, renderCurrentPage, gotoPage
        // ================================================================
        function getFilteredDomains() {
            const query = $('results-filter').value.toLowerCase().trim();
            let list = foundDomains;
            if (query) {
                list = list.filter(d => d.toLowerCase().includes(query));
            }
            if (currentSort === 'name') {
                list = list.slice().sort((a, b) => a.localeCompare(b));
            } else if (currentSort === 'length') {
                list = list.slice().sort((a, b) => {
                    const la = a.split('.')[0].length;
                    const lb = b.split('.')[0].length;
                    return la - lb || a.localeCompare(b);
                });
            }
            return list;
        }

        function renderCurrentPage() {
            const grid = $('results-grid');
            const pBar = $('pagination-bar');
            const total = foundDomains.length;

            if (total === 0) {
                grid.innerHTML = '';
                pBar.classList.remove('visible');
                $('results-empty').classList.add('visible');
                $('results-count').textContent = '0';
                return;
            }
            $('results-empty').classList.remove('visible');
            $('results-count').textContent = `${total}`;

            const filtered = getFilteredDomains();
            const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, filtered.length);
            const pageItems = filtered.slice(start, end);

            // Update pagination UI
            $('page-current').textContent = currentPage;
            $('page-total').textContent = totalPages;
            $('page-prev').disabled = currentPage <= 1;
            $('page-next').disabled = currentPage >= totalPages;
            pBar.classList.toggle('visible', totalPages > 1);

            // Rebuild grid — use DocumentFragment for performance
            const fragment = document.createDocumentFragment();
            pageItems.forEach(domain => {
                const parts = domain.split('.');
                const name = parts[0];
                const tld = parts.slice(1).join('.');
                const len = name.length;
                const card = document.createElement('div');
                card.className = 'domain-card';
                card.dataset.domain = domain;
                card.dataset.length = len;
                card.dataset.name = name;
                card.innerHTML = `
                    <div class="domain-card-main">
                        <span class="domain-name">${domain}</span>
                        <span class="domain-tld-badge">.${tld}</span>
                    </div>
                    <div class="domain-card-meta">
                        <span class="domain-length">${len} 字母</span>
                        <span class="domain-status available">可注册</span>
                    </div>
                    <div class="domain-card-actions">
                        <button class="btn-icon" title="复制" onclick="event.stopPropagation();copyDomain('${domain}', this)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        </button>
                    </div>
                `;
                fragment.appendChild(card);
            });
            grid.innerHTML = '';
            grid.appendChild(fragment);

            // Scroll to top when page changes
            grid.scrollTop = 0;
        }

        function gotoPage(n) {
            const filtered = getFilteredDomains();
            const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
            if (n < 1 || n > totalPages || n === currentPage) return;
            currentPage = n;
            renderCurrentPage();
        }

        // ================================================================
        // EMPTY STATE（区分「从未扫描」与「扫完但全部已注册」）
        // ================================================================
        function setEmptyState(mode, info = {}) {
            const icon = $('empty-icon');
            const title = $('empty-title');
            const desc = $('empty-desc');
            if (mode === 'zero') {
                icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>';

                    ? `已检测 ${info.total} 个候选，全部已被注册。试试换一组长度或前后缀。`
                    : '全部候选均已被注册，试试换一组长度或前后缀。';
            } else if (mode === 'stopped-zero') {
                icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
                title.textContent = '扫描已停止，未发现可注册域名';
                desc.textContent = info.checked

                    : '可调整参数后重新扫描';

                icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>';
                title.textContent = '还没有找到域名';
                desc.textContent = '启动一次扫描来发现可注册的短域名';

        // FILTER & SORT
        // ================================================================
        function filterResults() {
            currentPage = 1;
            const clearBtn = $('filter-clear');
            clearBtn.classList.toggle('visible', $('results-filter').value.length > 0);

        // ================================================================
        // COPY & EXPORT
        // ================================================================
        async function copyDomain(domain, btn) {
            try {
                // Try clipboard API first (needs HTTPS/localhost)
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(domain);
                } else {
                    // Fallback for HTTP: create temp textarea
                    const ta = document.createElement('textarea');
                    ta.value = domain;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                }
                const origHTML = btn.innerHTML;
                btn.innerHTML = '<span style="color:#10b981;font-size:16px;">✓</span>';
                setTimeout(() => { btn.innerHTML = origHTML; }, 1200);
                showToast('success', `已复制 ${domain}`, 2000);
            } catch (err) {
                showToast('error', '复制失败');
            }
        }

        async function copyAllDomains() {
            const list = getFilteredDomains();
            if (list.length === 0) {
                showToast('info', '没有可复制的域名');
                return;
            }
            try {
                const text = list.join('\n');
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                }
                showToast('success', `已复制 ${list.length} 个域名`, 2500);
            } catch (err) {
                showToast('error', '复制失败');
            }
        }

        function exportResults() {
            const list = getFilteredDomains();
            if (list.length === 0) {
                showToast('info', '没有可导出的域名');
                return;
            }
            const tld = $('tld').value;
            let label = '';
            if (currentMode === 'prefix') {
                const useP = $('use-prefix').checked;
                const useS = $('use-suffix').checked;
                const rawP = $('prefix').value.trim().toLowerCase() || 'x';
                const rawS = $('suffix').value.trim().toLowerCase() || '';
                const prefix = (useP && rawP !== '' && rawP !== '@') ? rawP : '';
                const suffix = (useS && rawS !== '' && rawS !== '@') ? rawS : '';
                const wlen = $('word-length').value;
                if (!prefix && !suffix) {
                    label = `${wlen}字母单词`;
                } else if (prefix && !suffix) {
                    label = `${prefix}+${wlen}字母`;
                } else if (!prefix && suffix) {
                    label = `${wlen}字母+${suffix}`;
                } else {
                    label = `${prefix}+${wlen}字母+${suffix}`;
                }
            } else {
                const checked = Array.from(document.querySelectorAll('#config-brute input[type="checkbox"][value]:checked'))
                    .map(cb => cb.value).sort();
                label = checked.length ? checked.join('-') + '字母' : '自定义';
            }
            const blob = new Blob([list.join('\n')], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${label}.${tld}_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('success', `已导出 ${list.length} 个域名`, 2000);
        }

        // ================================================================
        // CONFETTI
        // ================================================================

        // ================================================================
        // CONNECTION STATUS
        // ================================================================
        function updateConnStatus(status) {
            const dot = $('conn-dot');
            const text = $('conn-text');
            dot.className = 'conn-dot ' + status;
            const labels = { connected: '已连接', reconnecting: '重连中...', disconnected: '已断开' };
            text.textContent = labels[status] || '就绪';
        }

        // ================================================================
        // SAVE TO LOCALSTORAGE
        // ================================================================
        function saveToLocalStorage(domains) {
            try {
                const tld = $('tld').value;
                const data = {
                    tld: tld,
                    domains: domains,
                    timestamp: Date.now(),
                    config: getConfig(),
                };
                localStorage.setItem('domain_checker_last_results', JSON.stringify(data));
            } catch (e) { /* ignore */ }
        }

        // ================================================================
        // FINISH SCAN
        // ================================================================
        function finishScan() {
            if (eventSource) { eventSource.close(); eventSource = null; }
            resetUI();
            updateConnStatus('connected');
        }

        // ================================================================
        // CANCEL
        // ================================================================
        async function cancelScan() {
            if (!currentScanId) return;
            const btn = $('btn-cancel');
            if (btn.disabled) return; // 防止重复点击
            btn.disabled = true;
            btn.textContent = '正在停止…';
            try {
                await authFetch(`/scan/cancel/${currentScanId}`, { method: 'POST' });
            } catch (err) {
                console.error('取消失败:', err);
            }
            // 关闭 SSE（后端不会再收到事件，直接本地重置 UI）
            if (eventSource) { eventSource.close(); eventSource = null; }
            scanningActive = false;
            currentScanId = null;
            // 已找到的域名保留在结果区(历史侧栏也会留下这条记录)
            // 进度卡保持常显,保留停止时的进度供参考
            $('scanning-hint').classList.remove('visible');
            $('results-area').classList.toggle('visible', foundDomains.length > 0);
            if (foundDomains.length > 0) {
                currentPage = 1;
                renderCurrentPage();
                saveToLocalStorage(foundDomains);
                loadHistory();
            }
            finishScan(); // 重置开始/停止按钮状态
            showToast('info', foundDomains.length > 0
                ? `扫描已停止，已保留 ${foundDomains.length} 个结果并记入历史`
                : '扫描已停止');
        }

        // ================================================================
        // RESET UI
        // ================================================================
        function resetUI() {
            $('btn-start').disabled = false;
            $('btn-start').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg> 开始扫描';
            $('btn-cancel').classList.add('hidden');
            $('btn-cancel').disabled = false;
            $('btn-cancel').textContent = '停止';
            scanningActive = false;
        }

        // ================================================================
        // INCREMENTAL RECHECK BANNER
        // ================================================================
        function showIncrementalBanner(skipped, fullCount, recheckCount) {
            const banner = $('incremental-banner');
            const text = $('incremental-text');
            const pct = fullCount > 0 ? Math.round(skipped / fullCount * 100) : 0;
            text.textContent = `增量复检：跳过 ${skipped} 个已知注册域名（${pct}%），仅复检 ${recheckCount} 个`;
            banner.classList.add('visible');
            // auto dismiss after 12s
            clearTimeout(banner._timer);
            banner._timer = setTimeout(() => banner.classList.remove('visible'), 12000);
        }
        
        // ================================================================
        // HISTORY MODAL
        // ================================================================
        
        async function loadHistory() {
            const listEl = $('history-list');
            const emptyEl = $('history-empty');
            listEl.innerHTML = '';

            try {
                const resp = await authFetch('/history');
                const data = await resp.json();
                const items = data.items || [];

                $('history-count').textContent = `${items.length}`;

                if (items.length === 0) {
                    emptyEl.style.display = 'block';
                    listEl.style.display = 'none';
                    return;
                }
                emptyEl.style.display = 'none';
                listEl.style.display = 'block';

                const fmtTime = (ts) => {
                    if (!ts) return '';
                    const d = new Date(ts * 1000);
                    const now = new Date();
                    const diffMs = now - d;
                    const diffMin = Math.floor(diffMs / 60000);
                    if (diffMin < 1) return '刚刚';
                    if (diffMin < 60) return `${diffMin} 分钟前`;
                    const diffH = Math.floor(diffMin / 60);
                    if (diffH < 24) return `${diffH} 小时前`;
                    const diffD = Math.floor(diffH / 24);
                    if (diffD < 30) return `${diffD} 天前`;
                    return d.toLocaleDateString('zh-CN');
                };

                items.forEach(item => {
                    const modeLabel = item.mode === 'prefix_word' ? '单词' : '暴力';
                    const modeClass = item.mode === 'prefix_word' ? 'prefix' : 'brute';

                    // History item row
                    const el = document.createElement('div');
                    el.className = 'history-item';
                    el.dataset.id = item.id;
                    el.onclick = (e) => {
                        if (e.target.closest('.history-item-delete')) return;
                        toggleHistoryDetail(item.id);
                    };
                    el.innerHTML = `
                        <div class="history-item-main">
                            <div class="history-item-title">${escapeHtml(item.summary || '未知查询')}</div>
                            <div class="history-item-meta">
                                <span class="hi-tag ${modeClass}">${modeLabel}</span>
                                ${item.cancelled ? '<span class="hi-tag stopped">已停止</span>' : ''}
                                <span>${item.cancelled
                                    ? `已检测 ${item.checked || 0}/${item.total || 0}`
                                    : `${item.total || 0} 候选`}</span>
                                <span>${fmtTime(item.updated_at || item.created_at)}</span>
                            </div>
                        </div>
                        <div class="history-item-right">
                            <div class="history-item-stat">
                                <span class="hi-count">${item.available_count ?? 0}</span>
                                <span>可注册</span>
                            </div>
                            <button class="history-item-delete" title="删除" onclick="event.stopPropagation();deleteHistoryItem(${item.id})">×</button>
                        </div>
                    `;
                    listEl.appendChild(el);

                    // Detail placeholder (hidden by default)
                    const detail = document.createElement('div');
                    detail.className = 'history-detail';
                    detail.dataset.id = item.id;
                    listEl.appendChild(detail);
                });
            } catch (err) {
                listEl.innerHTML = '';
                emptyEl.style.display = 'block';
                emptyEl.querySelector('p').textContent = '加载失败: ' + err.message;
            }
        }

        async function toggleHistoryDetail(id) {
            const listEl = $('history-list');
            const detailEl = listEl.querySelector(`.history-detail[data-id="${id}"]`);
            if (!detailEl) return;

            // If already open — close it and un-collapse all
            if (detailEl.classList.contains('open')) {
                detailEl.classList.remove('open');
                detailEl.innerHTML = '';
                listEl.querySelectorAll('.history-item').forEach(el => el.classList.remove('collapsed'));
                return;
            }

            // Close all other details, collapse all items
            listEl.querySelectorAll('.history-detail.open').forEach(el => {
                el.classList.remove('open');
                el.innerHTML = '';
            });
            listEl.querySelectorAll('.history-item').forEach(el => el.classList.add('collapsed'));

            // Open this detail, un-collapse its parent item
            detailEl.classList.add('open');
            detailEl.innerHTML = '<div style="text-align:center;padding:12px;color:var(--text-muted);">加载中…</div>';
            const parentItem = listEl.querySelector(`.history-item[data-id="${id}"]`);
            if (parentItem) parentItem.classList.remove('collapsed');
            detailEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            try {
                const resp = await authFetch(`/history/${id}`);
                const rec = await resp.json();
                if (rec.error) {
                    detailEl.innerHTML = `<div style="color:var(--error);padding:8px;">${rec.error}</div>`;
                    return;
                }
                const avail = rec.available_list || [];
                const fmtTime = (ts) => {
                    if (!ts) return '';
                    return new Date(ts * 1000).toLocaleString('zh-CN');
                };
                detailEl.innerHTML = `
                    <div class="history-detail-header">
                        <span>${escapeHtml(rec.summary || '')}</span>
                        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();copyAllFromHistory(${id})">复制全部</button>
                    </div>
                    <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">
                        ${rec.total || 0} 候选 → ${avail.length} 可注册
                        ${rec.cancelled ? `&nbsp;·&nbsp; <span style="color:var(--warning,#f59e0b);">已停止（已检测 ${rec.checked || 0}，结果为部分）</span>` : ''}
                        &nbsp;·&nbsp; ${fmtTime(rec.updated_at || rec.created_at)}
                    </div>
                    <div class="hi-available-list">
                        ${avail.length === 0 ? '<span style="color:var(--text-muted);background:transparent;">无</span>' :
                            avail.map(d => `<span>${escapeHtml(d)}</span>`).join('')}
                    </div>
                `;
                detailEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } catch (err) {
                detailEl.innerHTML = `<div style="color:var(--error);padding:8px;">加载失败: ${err.message}</div>`;
            }
        }

        async function deleteHistoryItem(id) {
            if (!confirm('确定删除这条历史记录？')) return;
            try {
                const resp = await authFetch(`/history/delete/${id}`, { method: 'POST' });
                if (resp.ok) {
                    showToast('success', '已删除', 2000);
                    await loadHistory();
                } else {
                    showToast('error', '删除失败');
                }
            } catch (err) {
                showToast('error', '删除失败: ' + err.message);
            }
        }

        async function copyAllFromHistory(id) {
            try {
                const resp = await authFetch(`/history/${id}`);
                const rec = await resp.json();
                const avail = rec.available_list || [];
                if (avail.length === 0) {
                    showToast('info', '没有可复制的域名');
                    return;
                }
                const text = avail.join('\n');
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                }
                showToast('success', `已复制 ${avail.length} 个域名`, 2500);
            } catch (err) {
                showToast('error', '复制失败');
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ================================================================
        // THEME TOGGLE
        // ================================================================
        function initTheme() {
            const saved = localStorage.getItem('dc-theme');
            const theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.dataset.theme = theme;
            updateThemeIcon(theme);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
            html.dataset.theme = next;
            localStorage.setItem('dc-theme', next);
            updateThemeIcon(next);
        }

        function updateThemeIcon(theme) {
            const icon = $('theme-icon');
            if (icon) icon.innerHTML = theme === 'dark' ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>' : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
        }

        // ================================================================
        // KEYBOARD SHORTCUTS
        // ================================================================
        document.addEventListener('keydown', (e) => {
            // Ctrl+K / Cmd+K: focus filter
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                $('results-filter').focus();
                return;
            }
            // Ctrl+Shift+C: copy all
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'C') {
                e.preventDefault();
                copyAllDomains();
                return;
            }
            // Escape: cancel scan
            if (e.key === 'Escape' && scanningActive) {
                e.preventDefault();
                cancelScan();
                return;
            }
            // Enter: start scan (when not in an input that would conflict)
            if (e.key === 'Enter' && !scanningActive) {
                const active = document.activeElement;
                if (!active || active.tagName === 'BODY' || active.closest('.card') === $('config-card')) {
                    e.preventDefault();
                    startScan();
                }
            }
        });
    </script>
</body>
</html>
